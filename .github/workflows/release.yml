name: MANA release

on:
  push:
    # The exact version check below is authoritative. A broad tag filter lets
    # patch/minor releases use this workflow without editing this file each time.
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mana-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tag and project version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release_tag.py
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Build and verify VS Code extensions
        run: |
          python tools/vscode/build_mana_vsix.py
          python tools/vscode/build_mana_visualiser_vsix.py
          python tools/vscode/build_mana_vsix.py --check
          python tools/vscode/build_mana_visualiser_vsix.py --check
          node --check tools/vscode-extension/extension.js
          node --check tools/mana-visualiser-extension/extension.js
          node --check tools/mana-visualiser-extension/media/viewer.js
      - name: Audit development dependency tree
        run: python -m pip_audit --strict -r requirements-dev.txt
      - name: Run regression and stress tests
        run: |
          python -m pytest -q
          python tools/benchmark_many_creates.py
      - name: Verify version labels and generated documentation
        run: |
          python tools/version_sync.py --check
          python tools/sync_documentation_outputs.py --check
          python tools/generate_reference_index.py --check
          python tools/generate_error_catalogue.py --check
          python tools/render_release_notes.py --check
      - name: Syntax-check all MANA examples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for example in examples/*.mana; do
            python mana.py --check "$example"
          done

  publish:
    name: Build and publish release assets
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build release assets and current release notes
        shell: bash
        run: |
          set -euo pipefail
          python tools/vscode/build_mana_vsix.py
          python tools/vscode/build_mana_visualiser_vsix.py
          python tools/vscode/build_mana_vsix.py --check
          python tools/vscode/build_mana_visualiser_vsix.py --check
          python tools/package_project_zip.py
          python tools/render_release_notes.py --output dist/release-notes.md
      - name: Create or update GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Refusing to publish tag $RELEASE_TAG for VERSION $VERSION" >&2
            exit 1
          fi
          assets=(
            "dist/MANA-${VERSION}-source.zip"
            "installers/vscode/mana-language-${VERSION}.vsix"
            "installers/vscode/mana-magic-visualiser-${VERSION}.vsix"
          )
          title="MANA v${VERSION} — Magic Programming Language"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file dist/release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$title" \
              --verify-tag \
              --notes-file dist/release-notes.md
          fi
